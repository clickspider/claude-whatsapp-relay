# claude-whatsapp-relay config. Copy to relay.config.toml and fill it in.
# This file is the ONLY place for your personal values. relay.config.toml is git-ignored.
# Relative paths are relative to this file. "~" means your home folder.
# Risk levels: LOW = safe default, MED = think about it, HIGH = read SECURITY.md first.
# Check it any time with:  python3 relay.py check

[owner]
# Your own WhatsApp chat. ONLY this chat can control Claude. Format: <country code + number>@s.whatsapp.net
# Two owner channels, picked for you from the number you link to the bridge:
#   second number (recommended): the bridge runs on a second number; you message that number
#     from this one. Your own chats are never read.
#   own number: you link THIS number to the bridge. You talk to your assistant in your
#     "Message yourself" chat; only what you type there counts. The relay's own replies there are
#     recognised (message ID + recent text, kept in state/sent.json) and never start a run.
#     People you add get replies from your own number. `relay.py check` shows which mode is on.
jid = "31600000000@s.whatsapp.net"
# How Claude calls you in prompts and notes.
name = "Owner"
# The folder Claude works in (your dossier). MED: Claude reads and edits everything here from WhatsApp.
folder = "~/dossier"
# Your timezone (IANA name). Used for the daily new session.
timezone = "Europe/Amsterdam"
# Automatic /new: start a fresh Claude session every day at this hour. Context is not lost: the old
# session first writes a short hand-off (open topics, decisions, promises) that opens the new one. -1 = never.
new_session_hour = 4
# Automatic /new (with the same hand-off) when the context passes this many tokens. 0 = never.
max_context_tokens = 500000
# Messages you send within this many seconds (or while Claude is still busy) get ONE answer.
batch_seconds = 3
# Where files you send (photos, PDFs, documents) are copied, so they land in your folder.
# Relative to `folder`, e.g. "_inbox/whatsapp". "" = leave them in the bridge's media folder. LOW.
media_dir = ""
# Answer voice notes with a voice note (macOS `say`). LOW.
voice_replies = true
# Your writing style guide (how you write: tone, length, emoji, languages), e.g. made by Lore from your
# own sent messages. Relative to `folder`. When the file exists, its first 4 KB go into your Claude's
# prompt ("write like the owner" for drafts) and into agents with use_owner_voice. "" = off. LOW.
voice_file = "voice.md"
# Extra instructions for your Claude. "" = a short built-in prompt (plain text, short, @@ markers).
# A security line about untrusted data is always added after it.
system_prompt = ""
# Tools your Claude may use. LOW with file tools only. HIGH if you add "Bash" or "WebFetch":
# anyone who gets into your WhatsApp (or a message you forward) can then run commands on this computer.
tools = ["Read", "Write", "Edit", "Glob", "Grep"]
# Permission mode for the owner run: default | acceptEdits | plan | auto | dontAsk. bypassPermissions is refused.
permission_mode = "acceptEdits"
# MCP servers for your Claude, as a JSON file (same format as `claude --mcp-config`). "" = none. MED if set.
mcp_config = ""
# Rules approved without asking, e.g. "Bash(./backup.sh)". MED: each one is a door that WhatsApp can open.
allowed_tools = []
# Rules that are always refused, e.g. "mcp__whatsapp__send_message".
denied_tools = []
# Extra folders your Claude may use besides `folder`. MED.
extra_dirs = []
# HIGH. true = ignore tools/permission_mode/mcp_config above and use your global Claude setup
# (every tool, every MCP server, your permission mode). Only for an owner who knows why.
inherit_global_setup = false
# HIGH. true = start your Claude with --chrome (Claude in Chrome): it can click in your
# logged-in browser, so anyone who can write in your chat can too.
chrome = false

[bridge]
# The whatsapp-mcp bridge REST API. Must stay on 127.0.0.1 (the token is sent with every call).
api = "http://127.0.0.1:8080/api"
# The bridge's store/ folder: messages.db (read-only here) and .bridge-token.
# You can also set the token in the WHATSAPP_BRIDGE_TOKEN environment variable.
# install.sh puts the bridge here. Run your own bridge? Point this to its store/ folder.
store = "~/.claude-whatsapp-relay/whatsapp-mcp/whatsapp-bridge/store"
# Where voice replies are written before sending (the bridge's media folder).
outbox = "~/.local/share/whatsapp-mcp/outbox"

[paths]
claude = "claude"
ffmpeg = "ffmpeg"
whisper_cli = "whisper-cli"
# Local speech-to-text model. Get it with scripts/get-model.sh. Voice never leaves this computer.
whisper_model = "models/ggml-large-v3-turbo-q5_0.bin"
# Language of voice notes for whisper ("auto", "en", "nl", ...).
whisper_language = "auto"
# Session id, read cursor and hand-off notes. Created with mode 0700.
state_dir = "state"
# One folder per agent: RULES.md + its state files.
agents_dir = "agents"

[feedback]
# Show "typing..." in WhatsApp while Claude works (repeated every 10 s).
typing = true
# Reactions on your message: 👀 got it, ⏳ long job, ✅ done, ⚠️ failed.
reactions = true
# Claude may pick a fitting emoji instead of ✅ (❤️ sweet, 😂 joke, 🙏 thanks, 🎉 good news);
# a reaction alone can be the whole answer. Needs reactions = true. false = always ✅.
context_reactions = true
# Mark your message as read (blue ticks) when the relay picks it up.
mark_read = true
# Add ⏳ after this many seconds. 0 = never.
long_job_seconds = 180
# How often the relay checks for new messages, in seconds.
poll_seconds = 2
# Listening groups: wait this many quiet seconds, then the agent reads the batch at once.
group_digest_after_seconds = 120

[limits]
# Max messages handled per chat per minute and per day (also caps your Claude bill). 0 = no cap (MED).
per_minute = 6
per_day = 150
# Max group messages kept while waiting for a digest turn. 0 = unbounded (MED).
group_buffer_max = 40
# Kill a Claude run after this many seconds. 0 = never.
run_timeout_seconds = 600
# Ignore messages sent more than this many seconds before the relay started.
# After you link the bot number, WhatsApp copies old chat history in; this keeps the relay
# from answering it. Messages sent while the relay was off longer than this are skipped too.
# 0 = handle every new row, old or not (MED).
history_grace_seconds = 600
# Agents may read the last this-many messages of their own chat (old ones too) as context,
# in <agent home>/history.md, 500 characters each. Old messages never start a run. 0 = off.
history_messages = 200
# Anti-ban: a random gap of [min, max] seconds between two outgoing messages (all chats together).
# WhatsApp flags accounts that send bursts. The first message after a quiet spell goes at once;
# "typing..." already shows while Claude works (see [feedback]). [0, 0] = no gap (MED).
send_jitter_seconds = [1.5, 4.0]

[quiet_hours]
# Agents never START a conversation (check-ins, owner notes) in quiet hours. Replies still go out.
# "" = owner.timezone.
timezone = ""
start = 21
end = 9
# Whole days off, e.g. ["sun"]. Days: mon tue wed thu fri sat sun.
days_off = []
# Quiet from this hour on a given day, e.g. { fri = 15 }.
early_close = {}

[groups]
# Words that mean "the agent is addressed" in a listening group.
# A tap-to-mention (@Name) arrives as "@<number>" OR "@<LID>", so add both, or @mentions are ignored.
# Example: ["claude", "@31600000001", "@123456789012345"]
self_tags = ["claude"]

[ui]
# LOW. true = native WhatsApp polls for choices (needs a bridge with /api/poll; without it, text is used):
# a held draft gets a "Send / Change / Drop" poll (typed /<name> ok still works), and a line
# "@@ASK: question | option | option" from your Claude or an agent becomes a poll; the vote comes
# back as "ANSWER to ...". Only votes from the chat the poll went to count, each poll acts once.
# false = old behavior: typed commands, and @@ASK arrives as a numbered list.
polls = false
# LOW. Free key from developers.giphy.com: agents with gifs = true may send GIFs and stickers.
# Only the search words go to GIPHY. "" = off.
giphy_api_key = ""

[prompts]
# Fixed words the relay sends to agents. Your agents' RULES.md should use the same words.
owner_says = "OWNER SAYS: "
status = "STATUS FOR OWNER"
intro = "INTRO"
checkin = "CHECK-IN TIME"
from_owner_claude = "FROM OWNER'S CLAUDE: "
# Agents send you a note with a line "@@OWNER: <note>".
owner_note_marker = "OWNER"
# First words of a group digest prompt.
group_label = "GROUP."
# Sent when Claude's plan usage limit is reached: always to your chat, and once per reset window to
# an agent chat with trust = "reply" (draft agents stay silent). Write them in your contacts' language.
limit_reached = "I hit my Claude limit. Back at {time}."
limit_later = "I hit my Claude limit. Back later."

[hooks]
# Command run (as a list, no shell) after an agent log is written, at most every N seconds.
# MED: with a git push, other people's messages are copied off this computer. [] = off.
after_log = []
after_log_min_seconds = 600

[danger]
# HIGH. true = your Claude may edit relay.py, and the relay restarts itself when it changes.
# Text from WhatsApp could then change the code that runs next. Keep false.
self_edit = false
# LOW when true. Denies edits to ~/.claude/hooks, ~/.claude/settings*.json, ~/Library/LaunchAgents,
# <folder>/.claude, this config, the state dir and the relay code. false = HIGH.
protect_sensitive_paths = true
# HIGH. Needed for any agent with unrestricted = true (no --restricted sandbox). Keep false.
allow_unrestricted_agents = false

[publish]
# Opt-in, for people who change the relay code itself: every few hours, if the code folder
# has committed changes that are not on GitHub yet AND the tests pass, your chat gets one
# message asking you to publish. Reply /publish to push (never a force push). Off by default.
remind = false
remote = "origin"
branch = "main"
ssh_key = ""          # e.g. "~/.ssh/id_ed25519" if launchd cannot reach your ssh-agent
check_hours = 6

[power]
# A sleeping Mac answers nobody. true = the relay starts `caffeinate -i -s -w <relay pid>`: no idle or
# system sleep while it runs on power; it ends with the relay. No system settings are changed.
# On battery (or with the lid closed and no display) the Mac can still sleep: the log warns you. LOW.
keep_awake = true

[threads]
# Your chat works like a Claude Project. It becomes the coordinator: it answers small things itself and
# starts a thread for real work. Each thread is its own Claude session with your owner settings (same
# folder, tools and permissions) and runs in parallel, so a long task never blocks your chat.
# Thread messages start with "#<n> <title>:". Swipe-reply to one, or start your message with "#<n>",
# to talk to that thread. /threads lists the open ones, /done <n> closes one. Threads only talk to you.
# MED: more parallel Claude runs = more usage. false = one conversation (old behavior).
enabled = false
# Max threads that run Claude at the same time. The others wait their turn.
max_parallel = 3
# Shared timeline (state/threads/main.md): your chat, the coordinator and every thread result.
# Each thread run starts with the part it has not seen, and the coordinator sees the thread news,
# so a decision made in one place reaches the others. Max characters per run; 0 = off.
main_chat_chars = 10000
# Threads waiting in review this many hours close by themselves (a reply opens them again). 0 = never.
auto_close_hours = 72

[launchd]
# Used by scripts/install-launchd.sh (macOS) for the relay job. python must be 3.11 or newer.
label = "com.example.claude-whatsapp-relay"
python = "python3"
# Log folder, created with mode 0700 (logs can hold message text).
log_dir = "~/Library/Logs/claude-whatsapp-relay"

[install]
# Used only by install.sh. Change a value here, then run ./install.sh again.
# true = install.sh clones, builds, pairs and runs the whatsapp-mcp bridge for you (launchd, macOS).
# false = you run the bridge yourself: set bridge.store to its store/ folder.
manage_bridge = true
# Where the bridge code goes. Its whatsapp-bridge/store/ holds your WhatsApp session: keep it private.
# Keep bridge.store = <this folder>/whatsapp-bridge/store.
whatsapp_mcp_dir = "~/.claude-whatsapp-relay/whatsapp-mcp"
whatsapp_mcp_repo = "https://github.com/verygoodplugins/whatsapp-mcp.git"
# The bridge version to build (a git tag or commit). A fixed tag means you run code that was reviewed.
whatsapp_mcp_ref = "v0.7.0"
# launchd job that keeps the bridge running. Its log is <launchd.log_dir>/bridge.log.
bridge_label = "com.claude-whatsapp-relay.bridge"

# ---------- Agents: OFF by default. Each one is a locked Claude for one contact or group. ----------
# Every agent ALWAYS runs with --restricted, --strict-mcp-config, file tools only, and can only
# touch its own `home` folder (+ read_also). Copy agents/example/ to agents/<name>/ and edit RULES.md.
#
# [[agent]]
# name = "alex"                          # lowercase letters; you command it with /alex
# jid = "31600000001@s.whatsapp.net"     # the contact, or a group: "120363000000000000@g.us"
# live = false                           # false = only dry runs (/asalex <text>) from your chat
# trust = "draft"                        # draft = every reply waits for your "/alex ok" (LOW)
#                                        # reply = it answers by itself (MED)
# trigger = "all"                        # all | mention:<word> | listen (groups: reads all, speaks when tagged or when someone replies to it)
# self_tags = ["claude"]                 # listen groups: words that address it (default: [groups])
# members = { "31600000002" = "Sam" }    # group sender number -> name shown to the agent
# home = "agents/alex/home"              # its only writable folder (default: agents/<name>/home)
# read_also = []                         # extra folders it may use (MED: it can read them)
# write_also = []                        # MED: extra folders it may edit + create files in
# read_only = []                         # files/folders it must never edit
# checkins = false                       # it may plan its own next message with @@NEXT_CHECKIN
#                                        # and set reminders with @@REMIND: YYYY-MM-DD HH:MM | note
# self_per_day = 0                       # max check-ins/reminders a day it starts itself, unless the contact wrote after the last one (0 = no cap)
# quiet_hours = true                     # false = this agent ignores [quiet_hours] (check-ins + inbox notes any time)
# gifs = false                           # true = it may add @@GIF: <words> or @@STICKER: <words> (needs ui.giphy_api_key)
# mentions = false                       # true = it may tag a person from members with @@MENTION: <name> (groups; tag only, no DMs)
# inbox = false                          # your Claude may leave it notes in agents/<name>/inbox/
# use_owner_voice = true                 # write like you (owner.voice_file). Not set = on only in own-number
#                                        # mode, where its replies come from your own number; with a second
#                                        # number the agent speaks as your assistant, not as you.
# ask_contact = false                    # MED: the agent's @@ASK polls go to the contact, not to you.
#                                        # Needs trust = "reply" (the question skips your OK).
# timezone = ""                          # "" = quiet_hours.timezone
# tools = ["Read", "Write", "Edit", "Glob", "Grep"]   # file tools; add "WebSearch", "WebFetch" for web research (MED)
# plugin_dirs = []                      # Claude plugin folders with skills; add "Skill" to tools to use them
# extra_mcp_config = ""                  # HIGH: give it MCP servers (e.g. email). It stays --restricted.
# extra_allowed_tools = []               # HIGH: the MCP tools it may use without asking
# extra_disallowed_tools = []
# unrestricted = false                   # HIGH: drops the sandbox. Needs danger.allow_unrestricted_agents.
# max_context_tokens = 200000            # auto /new with a hand-off when its chat gets this big (0 = never)
# load_claude_connectors = false         # HIGH, needs unrestricted: your claude.ai connectors (Gmail...)
#                                        # load, and so does your global CLAUDE.md. Hooks + memory stay off.
